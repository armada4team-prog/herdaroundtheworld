name: Android app

# Builds the Android app on every change and publishes it as a download
# (Releases → "Test build"), so it can be installed straight onto an Android phone.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Check the code
        run: flutter analyze

      - name: Run the tests
        run: flutter test

      # Google Play upload key, from the repository secrets ANDROID_KEYSTORE_BASE64 and
      # ANDROID_KEYSTORE_PASSWORD (Settings -> Secrets and variables -> Actions).
      - name: Get the Google Play upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-key.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-key.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No Google Play upload key yet: the test build is signed with the debug key and no store file (.aab) is made."
          fi

      # Each build gets a higher version number, which Google Play needs for every upload.
      - name: Build the Android app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: upload
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            flutter build appbundle --release --build-number=${{ github.run_number }}
          fi

      - name: Publish the test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk herd-around-the-world.apk
          FILES="herd-around-the-world.apk"
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab herd-around-the-world.aab
            FILES="$FILES herd-around-the-world.aab"
          fi
          NOTES="Test build of Herd Around the World for Android, from $(date -u '+%B %-d, %Y at %H:%M UTC') (commit ${GITHUB_SHA::7}).

          To install: open this page on your Android phone, tap herd-around-the-world.apk, then open the download. If your phone asks, allow installs from your browser or Files app.

          herd-around-the-world.aab (when present) is the file to upload to Google Play, version ${{ github.run_number }}."
          if gh release view test-build >/dev/null 2>&1; then
            gh release upload test-build $FILES --clobber
            gh release edit test-build --notes "$NOTES" --title "Test build (Android)"
          else
            gh release create test-build $FILES --prerelease --title "Test build (Android)" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
