name: Android app

# Builds the Android app on every change and publishes it as a download
# (Releases → "Test build"), so it can be installed straight onto an Android phone.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Check the code
        run: flutter analyze

      - name: Run the tests
        run: flutter test

      - name: Build the Android app
        run: flutter build apk --release

      - name: Publish the test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk herd-around-the-world.apk
          NOTES="Test build of Herd Around the World for Android, from $(date -u '+%B %-d, %Y at %H:%M UTC') (commit ${GITHUB_SHA::7}).

          To install: open this page on your Android phone, tap herd-around-the-world.apk, then open the download. If your phone asks, allow installs from your browser or Files app."
          if gh release view test-build >/dev/null 2>&1; then
            gh release upload test-build herd-around-the-world.apk --clobber
            gh release edit test-build --notes "$NOTES" --title "Test build (Android)"
          else
            gh release create test-build herd-around-the-world.apk --prerelease --title "Test build (Android)" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
