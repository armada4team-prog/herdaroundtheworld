name: iPhone app

# Builds the iPhone version on a Mac to make sure it still compiles.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Build the iPhone app (simulator, unsigned)
        run: flutter build ios --simulator --debug --no-codesign
