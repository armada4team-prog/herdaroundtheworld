name: Screenshots

# Builds the app, runs it in the iPhone simulator, screenshots each screen,
# and saves the images to the "screenshots" branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          phones = [d for runtime, ds in devices.items() if 'iOS' in runtime for d in ds if d['name'].startswith('iPhone') and 'Pro' in d['name'] and 'Max' not in d['name']]
          phones = phones or [d for runtime, ds in devices.items() if 'iOS' in runtime for d in ds if d['name'].startswith('iPhone')]
          print(phones[-1]['udid'])
          ")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project HerdAroundTheWorld.xcodeproj -scheme HerdAroundTheWorld \
            -destination "id=$UDID" -derivedDataPath build -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -20

      - name: Run the app and take screenshots
        run: |
          APP="build/Build/Products/Debug-iphonesimulator/Herd Around the World.app"
          BUNDLE=com.theherdstudio.herdaroundtheworld
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$UDID" "$APP"
          mkdir -p "$RUNNER_TEMP/shots"
          i=0
          for s in splash home map scan passport activity companion hello found passon wish sent broke chat story learn signin language settings; do
            i=$((i+1))
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE" -uiScreen "$s"
            sleep 7
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/$(printf %02d $i)-$s.png"
          done
          ls -la "$RUNNER_TEMP/shots"

      - name: Record a real-use walkthrough video
        run: |
          xcrun simctl terminate "$UDID" com.theherdstudio.herdaroundtheworld 2>/dev/null || true
          # Build the test first, so the video starts when the tester starts.
          xcodebuild -project HerdAroundTheWorld.xcodeproj -scheme HerdAroundTheWorld \
            -destination "id=$UDID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            build-for-testing > "$RUNNER_TEMP/uitest-build.log" 2>&1 || tail -40 "$RUNNER_TEMP/uitest-build.log"
          xcrun simctl io "$UDID" recordVideo --codec h264 --force "$RUNNER_TEMP/shots/walkthrough.mp4" &
          REC=$!
          sleep 3
          set +e
          xcodebuild -project HerdAroundTheWorld.xcodeproj -scheme HerdAroundTheWorld \
            -destination "id=$UDID" -derivedDataPath build -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO test-without-building > "$RUNNER_TEMP/uitest.log" 2>&1
          RESULT=$?
          set -e
          sleep 2
          kill -INT $REC || true
          wait $REC || true
          { echo "UI test exit code: $RESULT"; grep -E "error:|failed|passed|Couldn’t find|Test Case|\*\* TEST" "$RUNNER_TEMP/uitest.log" | tail -80; echo "-----"; tail -40 "$RUNNER_TEMP/uitest.log"; } > "$RUNNER_TEMP/shots/walkthrough-result.txt"
          ls -la "$RUNNER_TEMP/shots"

      - name: Save screenshots to the screenshots branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan screenshots
          git rm -rfq --cached .
          git clean -fdxq
          cp "$RUNNER_TEMP"/shots/* .
          echo "Screenshots for ${GITHUB_SHA}" > README.md
          git add -A
          git commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -fq origin screenshots
