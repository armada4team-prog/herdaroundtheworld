name: HerdAroundTheWorld
options:
  bundleIdPrefix: com.theherdstudio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  HerdAroundTheWorld:
    type: application
    platform: iOS
    sources:
      - path: HerdAroundTheWorld
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.theherdstudio.herdaroundtheworld
        PRODUCT_NAME: Herd Around the World
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    info:
      path: HerdAroundTheWorld/Info.plist
      properties:
        CFBundleDisplayName: Herd Around the World
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - FiraSans-Regular.ttf
          - FiraSans-Medium.ttf
          - FiraSans-SemiBold.ttf
          - Baloo2-Bold.ttf
          - Baloo2-ExtraBold.ttf
          - ShadowsIntoLightTwo-Regular.ttf
        NSCameraUsageDescription: "Scan the code on a Companion’s bottom to see who they are and where they’ve been."
        NSLocationWhenInUseUsageDescription: "Fill in the city where you found or left a Companion. Only the city is ever shown."
        ITSAppUsesNonExemptEncryption: false
